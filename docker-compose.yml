services:
  minhas-contas:
    build: .
    container_name: minhas-contas
    ports:
      - "8000:8000"
    volumes:
      # Bind mount: o banco fica em ./data/financas.db, na raiz do projeto.
      # Sobrevive a `docker compose down -v` e e acessivel fora do container.
      - ./data:/data
    restart: unless-stopped
