; Ajustes de runtime do PHP para a aplicação.

; Erro nunca vai para o navegador — vira vazamento de caminho, versão e
; estrutura interna. Vai para o stderr do container (docker compose logs).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Assinatura do PHP fora dos headers HTTP.
expose_php = Off

; Upload da planilha. O limite real é aplicado em PHP (Config::UPLOAD_MAX_BYTES);
; estes são o teto do servidor, um pouco acima para a mensagem de erro ser a
; nossa, e não a genérica do Apache.
upload_max_filesize = 16M
post_max_size = 20M
max_file_uploads = 1
file_uploads = On

memory_limit = 256M
max_execution_time = 120

; A importação de uma planilha grande é o único caminho pesado.
max_input_vars = 200

; Sem sessões nativas: a autenticação usa cookie próprio + tabela sessions.
session.auto_start = Off

; Nada de abrir URL como se fosse arquivo — fecha SSRF/LFI por include.
allow_url_fopen = Off
allow_url_include = Off

date.timezone = UTC
